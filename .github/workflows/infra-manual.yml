name: Terraform Manual (plan / apply / destroy)

# Not tied to any branch push or PR. Trigger it yourself from the Actions
# tab: Actions -> Terraform Manual -> Run workflow -> pick an action.
# Mainly here so you can tear infra down (destroy) when you're not actively
# using it, and bring it back up (apply) later, without touching dev/main.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      confirm_destroy:
        description: 'Only checked when action = destroy. Type exactly "destroy" to confirm — anything else aborts the run before it touches anything.'
        required: false
        default: ""

defaults:
  run:
    working-directory: infra

permissions:
  contents: read

env:
  TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
  TF_WORKSPACE: ${{ secrets.TF_WORKSPACE }}

jobs:
  run:
    name: ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    environment: dev # secrets (TF_API_TOKEN etc.) live in this Environment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard destroy confirmation
        if: github.event.inputs.action == 'destroy' && github.event.inputs.confirm_destroy != 'destroy'
        run: |
          echo "Refusing to run: action is 'destroy' but confirm_destroy was not exactly 'destroy'."
          echo "Re-run the workflow and type destroy in the confirm_destroy field to proceed."
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        run: terraform plan -input=false

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false